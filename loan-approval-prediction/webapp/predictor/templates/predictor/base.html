{% load static %}<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Оцінка займу{% endblock %} | Оцінка займу</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E5C4E'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23E3A72F' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #F5F6F2; --card: #FFFFFF; --ink: #17231F; --muted: #5E6B66; --line: #DCE1DA;
      --brand: #0E5C4E; --brand-dark: #0A3F36; --header: #0C2F29; --amber: #E3A72F;
      --ok: #1D7A4B; --ok-bg: #E3F3EA; --no: #A93A27; --no-bg: #FBE9E5;
      --serif: "New York", "Iowan Old Style", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
    a { color: var(--brand); }
    h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0 0 .5em; }
    h1 { font-size: 2.1rem; }
    h2 { font-size: 1.4rem; }
    h3 { font-size: 1.1rem; }
    p { margin: 0 0 1em; }
    .muted { color: var(--muted); }

    /* ---------- шапка і меню ---------- */
    .site-header { background: var(--header); color: #fff; }
    .bar { max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center;
           justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none;
             font-family: var(--serif); font-size: 1.3rem; font-weight: 600; padding: 14px 0; }
    .brand svg { width: 30px; height: 30px; }
    .menu { display: flex; gap: 6px; }
    .menu a { color: #C9D8D3; text-decoration: none; padding: 20px 14px 17px; border-bottom: 3px solid transparent;
              font-weight: 600; font-size: .98rem; }
    .menu a:hover { color: #fff; }
    .menu a.active { color: #fff; border-bottom-color: var(--amber); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid var(--amber); outline-offset: 2px; }

    /* ---------- основа ---------- */
    main { max-width: 1080px; margin: 0 auto; padding: 36px 24px 56px; }
    .intro { max-width: 640px; margin-bottom: 28px; }
    .intro p { color: var(--muted); font-size: 1.05rem; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; }

    /* ---------- форма ---------- */
    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 24px; align-items: start; }
    .result-panel { position: sticky; top: 20px; }
    fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 8px; padding: 18px 0 6px; }
    fieldset:first-of-type { border-top: 0; padding-top: 0; }
    legend { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; padding: 0 0 12px; float: left; width: 100%; }
    fieldset .grid { clear: both; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
    .field label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 5px; }
    .field input, .field select { width: 100%; padding: 10px 11px; font: inherit; color: var(--ink); background: #fff;
                                  border: 1px solid #B9C2BC; border-radius: 7px; }
    .field input:hover, .field select:hover { border-color: var(--brand); }
    .hint { color: var(--muted); font-size: .82rem; margin: 5px 0 0; }
    .error { color: var(--no); font-size: .85rem; font-weight: 600; margin: 5px 0 0; }
    .has-error input, .has-error select { border-color: var(--no); }
    .alert { background: var(--no-bg); border: 1px solid #E6B8AF; color: var(--no); border-radius: 8px;
             padding: 12px 14px; margin-bottom: 18px; font-weight: 600; }
    .alert p { margin: 0; }
    .btn { display: inline-block; background: var(--brand); color: #fff; border: 0; border-radius: 8px;
           padding: 13px 26px; font: 600 1rem var(--sans); cursor: pointer; text-decoration: none; margin-top: 10px; }
    .btn:hover { background: var(--brand-dark); }

    /* ---------- результат ---------- */
    .verdict { border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
    .verdict.ok { background: var(--ok-bg); color: var(--ok); }
    .verdict.no { background: var(--no-bg); color: var(--no); }
    .verdict-title { font-family: var(--serif); font-size: 2rem; font-weight: 700; margin: 0; line-height: 1.1; }
    .verdict p:last-child { margin: 6px 0 0; color: var(--ink); }
    .meter { height: 10px; background: #E7EBE6; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
    .meter span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
    details { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
    summary { cursor: pointer; font-weight: 600; }
    dl.data { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .88rem; margin: 12px 0 0; }
    dl.data dt { color: var(--muted); }
    dl.data dd { margin: 0; font-weight: 600; }
    .note { font-size: .85rem; color: var(--muted); margin: 16px 0 0; }

    /* ---------- історія ---------- */
    .stats { display: flex; gap: 32px; flex-wrap: wrap; margin: 0 0 22px; }
    .stats div { min-width: 90px; }
    .stats dt { color: var(--muted); font-size: .85rem; }
    .stats dd { margin: 0; font-family: var(--serif); font-size: 1.7rem; font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: .92rem; white-space: nowrap; }
    th { font-weight: 600; color: var(--muted); background: #F0F3EE; }
    .badge { display: inline-block; padding: 3px 11px; border-radius: 99px; font-weight: 700; font-size: .85rem; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.no { background: var(--no-bg); color: var(--no); }
    .empty { text-align: center; padding: 30px 10px; }

    /* ---------- про сервіс ---------- */
    .steps { list-style: none; counter-reset: step; padding: 0; margin: 0 0 8px; }
    .steps li { counter-increment: step; position: relative; padding: 0 0 18px 48px; }
    .steps li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 32px; height: 32px;
                        border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700;
                        display: grid; place-items: center; }
    .steps strong { display: block; }
    .stack { display: grid; gap: 24px; max-width: 760px; }
    .tech { width: 100%; min-width: 0; }
    .tech td { white-space: normal; }
    .tech td:first-child { font-weight: 600; width: 34%; }

    footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 40px; color: var(--muted); font-size: .85rem; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .result-panel { position: static; }
      .has-result .result-panel { order: -1; }
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.7rem; }
      .panel { padding: 20px 18px; }
      .menu a { padding: 12px 10px 10px; }
      .bar { gap: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  {% with current=request.resolver_match.url_name %}
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="{% url 'index' %}">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#E3A72F"/><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#0C2F29" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Оцінка займу
      </a>
      <nav class="menu" aria-label="Головне меню">
        <a href="{% url 'index' %}" class="{% if current == 'index' %}active{% endif %}"{% if current == 'index' %} aria-current="page"{% endif %}>Перевірити займ</a>
        <a href="{% url 'history' %}" class="{% if current == 'history' %}active{% endif %}"{% if current == 'history' %} aria-current="page"{% endif %}>Історія перевірок</a>
        <a href="{% url 'about' %}" class="{% if current == 'about' %}active{% endif %}"{% if current == 'about' %} aria-current="page"{% endif %}>Як це працює</a>
      </nav>
    </div>
  </header>
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>Навчальний проєкт. Прогноз не є рішенням банку.</footer>
</body>
</html>
